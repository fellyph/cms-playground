name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build:site
      - run: npm test
      - run: npm run test:e2e:cli
      - run: node packages/cli/bin/cms-playground.mjs list

  e2e:
    name: E2E (${{ matrix.cms }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cms: [joomla, wp]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ~/.cache/cms-playground/${{ matrix.cms }}
          key: cms-playground-${{ matrix.cms }}-v1

      - run: npm ci
      - run: npm run test:e2e:${{ matrix.cms }}
